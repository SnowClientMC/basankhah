<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SnowClient Partners — Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#e6f0f9;--bg2:#f4f9fe;--card:#fff;--ink:#0c1f33;--muted:#566d86;--line:#c3d6e8;--brand:#1670c2;--brand-ink:#fff;--btn:#d9e8f5;--danger:#c4304a;--ok:#12803f;--shadow:0 2px 6px rgba(40,90,150,.12),0 12px 32px rgba(40,90,150,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#12171d;--bg2:#171e26;--card:#1f262e;--ink:#ecf9fb;--muted:#96a2b0;--line:#2c3640;--brand:#6cc4ff;--brand-ink:#04111c;--btn:#2b3540;--danger:#ff6b81;--ok:#4be08a;--shadow:0 2px 6px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg2),var(--bg) 60%);min-height:100vh;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem}
.logo svg{width:30px;height:30px;color:var(--brand)}
.sub{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 5px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
button{font:inherit;font-weight:700;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--btn);color:var(--ink)}
button.primary{background:var(--brand);color:var(--brand-ink)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{position:relative;aspect-ratio:16/9;max-width:420px;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--bg2)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{margin-top:12px;font-weight:700;min-height:1.4em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.list{display:grid;gap:14px}
.item{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--bg2)}
.item img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--btn)}
.item .ip{font-weight:800;word-break:break-all}
.item .d{color:var(--muted);font-size:.92rem;margin:2px 0 10px}
.hidden{display:none!important}
.empty{color:var(--muted);text-align:center;padding:18px}
@media(max-width:600px){.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g id="a"><path d="M50 50V9M50 36l-10-10M50 36l10-10M50 23l-7-7M50 23l7-7"/></g><use href="#a" transform="rotate(60 50 50)"/><use href="#a" transform="rotate(120 50 50)"/><use href="#a" transform="rotate(180 50 50)"/><use href="#a" transform="rotate(240 50 50)"/><use href="#a" transform="rotate(300 50 50)"/></svg>
      <div>SnowClient Partners<div class="sub">Manage the servers shown inside the launcher</div></div></div>
    <button id="logout" class="hidden">Log out</button>
  </header>

  <!-- Login -->
  <section id="login" class="card">
    <h2>Admin login</h2>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Admin password">
    <div class="row" style="margin-top:14px"><button id="loginBtn" class="primary">Log in</button></div>
    <div id="loginMsg" class="msg"></div>
  </section>

  <div id="app" class="hidden">
    <!-- Add / edit -->
    <section class="card">
      <h2 id="formTitle">Add a partnered server</h2>
      <label>Landscape image</label>
      <div class="drop" id="drop">
        <span id="dropText">Click to choose an image<br><small>It is cropped to 16:9 automatically</small></span>
        <img id="preview" class="hidden" alt="">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
      </div>
      <label for="ip">Server IP</label>
      <input id="ip" type="text" placeholder="play.example.com" maxlength="100" autocomplete="off">
      <label for="desc">One-line description</label>
      <input id="desc" type="text" placeholder="Survival, skyblock and minigames" maxlength="90" autocomplete="off">
      <div class="hint"><span id="count">0</span>/90 characters</div>
      <div class="row" style="margin-top:16px">
        <button id="save" class="primary">Add server</button>
        <button id="cancel" class="hidden">Cancel edit</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </section>

    <!-- Current list -->
    <section class="card">
      <h2>Current partners</h2>
      <div id="list" class="list"></div>
      <div id="empty" class="empty hidden">No partnered servers yet.</div>
    </section>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id) };
  var password = '';
  try { password = sessionStorage.getItem('sc_admin_pw') || '' } catch (e) {}
  var editingId = null, imageBlob = null;

  function api(method, query, body) {
    return fetch('/api/admin/partners' + (query || ''), {
      method: method, body: body, headers: { 'X-Admin-Password': password }
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j }) });
  }
  function msg(el, text, ok) { el.textContent = text || ''; el.className = 'msg ' + (text ? (ok ? 'ok' : 'err') : '') }

  function showApp(on) {
    $('login').classList.toggle('hidden', on); $('app').classList.toggle('hidden', !on); $('logout').classList.toggle('hidden', !on);
  }

  function load() {
    return api('GET').then(function (data) {
      showApp(true); render(data.servers);
    }).catch(function (e) {
      showApp(false); msg($('loginMsg'), password ? e.message : '', false);
    });
  }

  function render(servers) {
    var list = $('list'); list.textContent = '';
    $('empty').classList.toggle('hidden', servers.length > 0);
    servers.forEach(function (s) {
      var item = document.createElement('div'); item.className = 'item';
      var img = document.createElement('img'); img.alt = ''; if (s.image) img.src = s.image;
      var box = document.createElement('div');
      var ip = document.createElement('div'); ip.className = 'ip'; ip.textContent = s.ip;
      var d = document.createElement('div'); d.className = 'd'; d.textContent = s.description;
      var row = document.createElement('div'); row.className = 'row';
      var edit = document.createElement('button'); edit.textContent = 'Edit';
      edit.onclick = function () { startEdit(s) };
      var del = document.createElement('button'); del.textContent = 'Remove'; del.className = 'danger';
      del.onclick = function () {
        if (!confirm('Remove ' + s.ip + ' from the launcher?')) return;
        api('DELETE', '?id=' + encodeURIComponent(s.id)).then(load).catch(function (e) { alert(e.message) });
      };
      row.appendChild(edit); row.appendChild(del);
      box.appendChild(ip); box.appendChild(d); box.appendChild(row);
      item.appendChild(img); item.appendChild(box); list.appendChild(item);
    });
  }

  function resetForm() {
    editingId = null; imageBlob = null;
    $('ip').value = ''; $('desc').value = ''; $('count').textContent = '0'; $('file').value = '';
    $('preview').classList.add('hidden'); $('dropText').classList.remove('hidden');
    $('formTitle').textContent = 'Add a partnered server'; $('save').textContent = 'Add server'; $('cancel').classList.add('hidden');
  }
  function startEdit(s) {
    resetForm(); editingId = s.id; $('ip').value = s.ip; $('desc').value = s.description; $('count').textContent = s.description.length;
    if (s.image) { $('preview').src = s.image; $('preview').classList.remove('hidden'); $('dropText').classList.add('hidden') }
    $('formTitle').textContent = 'Edit server'; $('save').textContent = 'Save changes'; $('cancel').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('cancel').onclick = function () { resetForm(); msg($('formMsg'), '') };
  $('desc').oninput = function () { $('count').textContent = $('desc').value.length };

  // Crop to 16:9 and shrink to 1280x720 JPEG in the browser so uploads stay small and landscape
  $('file').onchange = function () {
    var f = $('file').files[0]; if (!f) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      var W = 1280, H = 720, c = document.createElement('canvas'); c.width = W; c.height = H;
      var ctx = c.getContext('2d'), target = W / H, r = im.width / im.height, sx, sy, sw, sh;
      if (r > target) { sh = im.height; sw = sh * target; sx = (im.width - sw) / 2; sy = 0 } else { sw = im.width; sh = sw / target; sx = 0; sy = (im.height - sh) / 2 }
      ctx.drawImage(im, sx, sy, sw, sh, 0, 0, W, H);
      c.toBlob(function (b) {
        imageBlob = b; $('preview').src = URL.createObjectURL(b); $('preview').classList.remove('hidden'); $('dropText').classList.add('hidden');
      }, 'image/jpeg', 0.86);
      URL.revokeObjectURL(url);
    };
    im.onerror = function () { msg($('formMsg'), 'Could not read that image.', false) };
    im.src = url;
  };

  $('save').onclick = function () {
    var fd = new FormData();
    fd.append('ip', $('ip').value); fd.append('description', $('desc').value);
    if (imageBlob) fd.append('image', imageBlob, 'cover.jpg');
    $('save').disabled = true; msg($('formMsg'), 'Saving…', true);
    var req = editingId ? api('PUT', '?id=' + encodeURIComponent(editingId), fd) : api('POST', '', fd);
    req.then(function () { resetForm(); msg($('formMsg'), 'Saved! The launcher will show it shortly.', true); return load() })
       .catch(function (e) { msg($('formMsg'), e.message, false) })
       .then(function () { $('save').disabled = false });
  };

  $('loginBtn').onclick = function () {
    password = $('pw').value; try { sessionStorage.setItem('sc_admin_pw', password) } catch (e) {}
    msg($('loginMsg'), 'Checking…', true); load();
  };
  $('pw').onkeydown = function (e) { if (e.key === 'Enter') $('loginBtn').click() };
  $('logout').onclick = function () { password = ''; try { sessionStorage.removeItem('sc_admin_pw') } catch (e) {} showApp(false); $('pw').value = '' };

  if (password) load();
})();
</script>
</body>
</html>
